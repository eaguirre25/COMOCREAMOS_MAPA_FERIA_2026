<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>Feria de Ciencias Humanas — El camino de la investigación</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: #07131d;
    }

    .selector-page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding:
        calc(20px + env(safe-area-inset-top))
        calc(18px + env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom))
        calc(18px + env(safe-area-inset-left));
      isolation: isolate;
      background-image: url('assets/feria-fondo.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .selector-page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(to bottom,
          rgba(0, 0, 0, .06) 0%,
          rgba(0, 0, 0, .08) 48%,
          rgba(0, 0, 0, .42) 76%,
          rgba(0, 0, 0, .68) 100%);
      pointer-events: none;
    }

    .choices {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: clamp(4px, 2vh, 20px);
    }

    .choice {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 22px;
      border: 2px solid rgba(80, 240, 255, .9);
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      font-weight: 800;
      letter-spacing: .02em;
      text-shadow: 0 2px 6px rgba(0,0,0,.8);
      background: rgba(3, 18, 30, .72);
      box-shadow:
        0 8px 28px rgba(0, 0, 0, .36),
        inset 0 0 22px rgba(0, 221, 255, .10);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      touch-action: manipulation;
    }

    .choice:hover,
    .choice:focus-visible {
      transform: translateY(-3px);
      background: rgba(4, 35, 54, .9);
      border-color: #fff;
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .choice-icon {
      font-size: 1.7em;
      line-height: 1;
    }

    @media (max-width: 640px) {
      .selector-page {
        background-position: center top;
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
      }

      .selector-page::before {
        background:
          linear-gradient(to bottom,
            rgba(0, 0, 0, .02) 0%,
            rgba(0, 0, 0, .08) 48%,
            rgba(0, 0, 0, .58) 72%,
            rgba(0, 0, 0, .82) 100%);
      }

      .choices {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .choice {
        min-height: 64px;
        padding: 13px 18px;
        border-radius: 13px;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .selector-page {
        align-items: flex-end;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .choices { width: min(680px, 90%); }
      .choice { min-height: 58px; padding: 10px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .choice { transition: none; }
    }
  </style>
</head>
<body>
  <main class="selector-page" aria-label="Seleccionar versión del recorrido">
    <nav class="choices">
      <a class="choice" href="mobile.html">
        <span class="choice-icon" aria-hidden="true">📱</span>
        <span>Versión móvil</span>
      </a>
      <a class="choice" href="desktop.html">
        <span class="choice-icon" aria-hidden="true">🖥️</span>
        <span>Versión escritorio</span>
      </a>
    </nav>
  </main>
</body>
</html>
