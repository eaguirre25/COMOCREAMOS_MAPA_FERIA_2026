<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>Feria de Ciencias Humanas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07131d;
    }
    .background {
      position: fixed;
      inset: 0;
      background: #07131d center / cover no-repeat;
      filter: brightness(.86) saturate(.96);
      transform: scale(1.002);
    }
    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.01) 42%, rgba(0,0,0,.11));
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left));
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(170px, 230px));
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 17px;
      background: rgba(3,15,26,.38);
      box-shadow: 0 10px 34px rgba(0,0,0,.25);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }
    .choice {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      border: 2px solid rgba(82,239,255,.88);
      border-radius: 13px;
      color: #fff;
      text-decoration: none;
      background: rgba(4,22,36,.84);
      box-shadow: inset 0 0 18px rgba(0,220,255,.12), 0 4px 15px rgba(0,0,0,.25);
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,.8);
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
      touch-action: manipulation;
    }
    .choice:hover, .choice:focus-visible {
      transform: translateY(-2px);
      background: rgba(7,45,66,.96);
      border-color: #fff;
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .icon { font-size: 1.5rem; line-height: 1; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #07131d;
      color: #fff;
      font-weight: 700;
      transition: opacity .25s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    @media (max-width: 720px) {
      .background { background-position: center; }
      main {
        justify-content: center;
        padding-top: calc(12px + env(safe-area-inset-top));
      }
      .choices {
        width: min(100%, 430px);
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 8px;
        border-radius: 14px;
      }
      .choice {
        min-height: 58px;
        padding: 10px 8px;
        font-size: .88rem;
        line-height: 1.12;
      }
      .icon { font-size: 1.2rem; }
    }
    @media (max-width: 390px) {
      .choices { grid-template-columns: 1fr; width: min(78vw, 260px); }
      .choice { min-height: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .choice, .loading { transition: none; }
    }
  </style>
</head>
<body>
  <div class="background" id="background" aria-hidden="true"></div>
  <main aria-label="Seleccionar versión del recorrido">
    <nav class="choices">
      <a class="choice" href="mobile.html">
        <span class="icon" aria-hidden="true">📱</span>
        <span>Versión móvil</span>
      </a>
      <a class="choice" href="desktop.html">
        <span class="icon" aria-hidden="true">🖥️</span>
        <span>Versión escritorio</span>
      </a>
    </nav>
  </main>
  <div class="loading" id="loading">Preparando la portada…</div>
  <script>
    (async () => {
      const background = document.getElementById('background');
      const loading = document.getElementById('loading');
      try {
        const source = 'assets/selector-campus-2026.jpg';
        const image = new Image();
        image.onload = () => {
          background.style.backgroundImage = `url("${source}")`;
          loading.classList.add('hidden');
        };
        image.onerror = () => {
          background.style.backgroundImage = 'url("assets/selector-campus-2026.jpg")';
          loading.classList.add('hidden');
        };
        image.src = source;
      } catch (error) {
        console.error(error);
        background.style.backgroundImage = 'url("assets/selector-campus-2026.jpg")';
        loading.classList.add('hidden');
      }
    })();
  </script>
</body>
</html>
