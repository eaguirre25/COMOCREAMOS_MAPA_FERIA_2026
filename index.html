<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>Feria de Ciencias Sociales y Humanas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #07131d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .portal {
      position: relative;
      width: min(100vw, 150dvh);
      aspect-ratio: 3 / 2;
      max-height: 100dvh;
    }
    .portal-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      top: 70.15%;
      height: max(9.8%, 44px);
      transform: translateY(-50%);
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: transparent;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .16s ease, box-shadow .16s ease;
    }
    .hotspot-mobile {
      left: 27.15%;
      width: max(20%, 110px);
    }
    .hotspot-desktop {
      left: 48.45%;
      width: max(24.4%, 130px);
    }
    .hotspot:hover {
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 0 24px rgba(0, 238, 255, .65);
    }
    .hotspot:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
      background: rgba(255, 255, 255, .12);
    }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #07131d;
      color: #fff;
      font-weight: 700;
      transition: opacity .25s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .hotspot, .loading { transition: none; }
    }
  </style>
</head>
<body>
  <main class="portal" aria-label="Seleccionar versión del recorrido">
    <img
      id="portal-image"
      class="portal-image"
      src="assets/selector-portada-interactiva.png"
      alt="Feria de Ciencias Sociales y Humanas. Elegí la versión móvil o de escritorio."
    >
    <a class="hotspot hotspot-mobile" href="mobile.html" aria-label="Ingresar a la versión móvil">
      Versión móvil
    </a>
    <a class="hotspot hotspot-desktop" href="desktop.html" aria-label="Ingresar a la versión escritorio">
      Versión escritorio
    </a>
  </main>
  <div class="loading" id="loading" role="status">Preparando la portada…</div>
  <script>
    (() => {
      const image = document.getElementById('portal-image');
      const loading = document.getElementById('loading');
      const finish = () => loading.classList.add('hidden');
      if (image.complete) finish();
      else {
        image.addEventListener('load', finish, { once: true });
        image.addEventListener('error', finish, { once: true });
      }
    })();
  </script>
</body>
</html>
