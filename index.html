<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>Feria de Ciencias Sociales y Humanas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background: #07131d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .portal {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }
    .portal-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }
    .portal::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(4, 10, 18, .32), transparent 28%, transparent 68%, rgba(4, 10, 18, .7));
    }
    .portal-brand {
      position: absolute;
      z-index: 2;
      top: max(18px, env(safe-area-inset-top, 0px));
      left: 50%;
      width: clamp(220px, 25vw, 390px);
      max-height: 14vh;
      object-fit: contain;
      transform: translateX(-50%);
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
    }
    .version-actions {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: max(30px, calc(env(safe-area-inset-bottom, 0px) + 18px));
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: clamp(14px, 2vw, 28px);
      width: min(92vw, 850px);
    }
    .hotspot {
      min-height: 68px;
      flex: 1 1 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border: 2px solid #00efff;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(0, 192, 202, .96), rgba(0, 91, 211, .96));
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      text-align: center;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 800;
      letter-spacing: .03em;
      text-shadow: 0 2px 5px rgba(0, 0, 0, .5);
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 0 22px rgba(0, 238, 255, .5), 0 10px 24px rgba(0, 0, 0, .35);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .hotspot:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
      box-shadow: 0 0 32px rgba(0, 238, 255, .8), 0 14px 28px rgba(0, 0, 0, .45);
    }
    .hotspot:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
      background: rgba(255, 255, 255, .12);
    }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #07131d;
      color: #fff;
      font-weight: 700;
      transition: opacity .25s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    @media (orientation: portrait) {
      .portal-image { object-fit: contain; }
      .portal-brand {
        top: max(16px, calc(env(safe-area-inset-top, 0px) + 8px));
        width: min(76vw, 360px);
      }
      .version-actions {
        bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px));
        flex-direction: column;
        width: min(88vw, 430px);
        gap: 12px;
      }
      .hotspot {
        min-height: 58px;
        padding: 12px 18px;
        font-size: 18px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hotspot, .loading { transition: none; }
    }
  </style>
</head>
<body>
  <main class="portal" aria-label="Seleccionar versión del recorrido">
    <img
      id="portal-image"
      class="portal-image"
      src="CIENCIA Y FICCION.png"
      alt="Ciencia y Ficción, XI edición 2026."
    >
    <img class="portal-brand" src="assets/feria-ciencias-humanas-sociales-logo.png" alt="Feria de Ciencias Humanas y Sociales">
    <nav class="version-actions" aria-label="Elegir versión de la experiencia">
      <a class="hotspot hotspot-mobile" href="mobile.html" aria-label="Ingresar al recorrido desde un dispositivo móvil">
        Versión móvil
      </a>
      <a class="hotspot hotspot-desktop" href="mobile.html" aria-label="Ingresar al recorrido desde una computadora">
        Versión escritorio
      </a>
    </nav>
  </main>
  <div class="loading" id="loading" role="status">Preparando la portada…</div>
  <script>
    (() => {
      const image = document.getElementById('portal-image');
      const loading = document.getElementById('loading');
      const finish = () => loading.classList.add('hidden');
      if (image.complete) finish();
      else {
        image.addEventListener('load', finish, { once: true });
        image.addEventListener('error', finish, { once: true });
      }
    })();
  </script>
</body>
</html>
